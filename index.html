<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏大厅 Mini Games</title>
<style>
  :root { --bg:#1b1f2a; --panel:#283041; --line:#141821; --text:#e8ecf5; --accent:#ffb454; --good:#4ec9b0; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #232a3a, var(--bg));
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:32px 16px 48px; }
  h1 { font-size:26px; letter-spacing:3px; margin:0 0 4px; }
  .sub { color:#8b94ab; font-size:14px; margin-bottom:28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; width:100%; max-width:560px; }
  .card { background:var(--panel); border:1px solid #3a4256; border-radius:16px; padding:22px 16px; text-align:center;
    text-decoration:none; color:var(--text); transition:.15s; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .card:hover { transform:translateY(-4px); border-color:var(--accent); box-shadow:0 12px 28px rgba(0,0,0,.35); }
  .card .ico { font-size:46px; }
  .card .name { font-size:17px; font-weight:700; }
  .card .desc { font-size:12px; color:#8b94ab; line-height:1.6; min-height:32px; }
  .card .play { margin-top:6px; background:var(--accent); color:#1b1f2a; font-weight:700; padding:8px 20px; border-radius:10px; font-size:14px; }
  .foot { margin-top:32px; color:#5b6276; font-size:12px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <h1>🎮 小游戏大厅</h1>
  <div class="sub">单文件 · 即点即玩 · 手机电脑通用</div>
  <div class="grid">
    <a class="card" href="扫雷.html">
      <div class="ico">💣</div>
      <div class="name">扫雷</div>
      <div class="desc">三档难度 · 首点保护 · 插旗 · 和弦快开</div>
      <div class="play">开始 ▸</div>
    </a>
    <a class="card" href="tetris.html">
      <div class="ico">🧱</div>
      <div class="name">俄罗斯方块</div>
      <div class="desc">7 种方块 · 消行计分 · 带触屏按钮</div>
      <div class="play">开始 ▸</div>
    </a>
    <a class="card" href="breakout.html">
      <div class="ico">🟧</div>
      <div class="name">打砖块</div>
      <div class="desc">手指拖动挡板 · 多关卡 · 计分闯关</div>
      <div class="play">开始 ▸</div>
    </a>
    <a class="card" href="gobang.html">
      <div class="ico">⚫</div>
      <div class="name">五子棋</div>
      <div class="desc">人机 AI · 双人对战 · 15 路棋盘</div>
      <div class="play">开始 ▸</div>
    </a>
    <a class="card" href="plane.html">
      <div class="ico">🚀</div>
      <div class="name">飞机大战</div>
      <div class="desc">躲弹幕 · 击落敌机 · 闯关计分</div>
      <div class="play">开始 ▸</div>
    </a>
  </div>
  <div class="foot">现已收录 5 款小游戏 · 仓库：github.com/hovey233/mini-games</div>
</body></html>
