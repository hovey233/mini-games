<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块 Breakout</title>
<style>
  :root { --bg:#1b1f2a; --line:#141821; --text:#e8ecf5; --accent:#ffb454; --good:#4ec9b0; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #232a3a, var(--bg));
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:18px 12px 36px; }
  h1 { font-size:20px; letter-spacing:2px; margin:2px 0 12px; }
  .hud { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
  .box { background:var(--line); border-radius:10px; padding:6px 14px; text-align:center; min-width:70px; }
  .box .k { font-size:11px; color:#8b94ab; } .box .v { font-size:18px; font-weight:700; color:var(--accent); }
  canvas { background:var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); touch-action:none; display:block; }
  .face { margin-top:12px; width:46px; height:46px; border-radius:50%; border:none; background:var(--accent);
    color:#1b1f2a; font-size:22px; cursor:pointer; }
  .status { min-height:20px; margin-top:12px; color:var(--good); font-weight:600; text-align:center; }
  .tips { color:#8b94ab; font-size:12px; margin-top:14px; max-width:340px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <a href="index.html" style="position:fixed;top:10px;left:12px;z-index:50;background:#283041;color:#e8ecf5;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:13px;border:1px solid #3a4256;">🏠 大厅</a>
  <h1>🧱 打砖块 BREAKOUT</h1>
  <div class="hud">
    <div class="box"><div class="k">分数</div><div class="v" id="score">0</div></div>
    <div class="box"><div class="k">关卡</div><div class="v" id="level">1</div></div>
    <div class="box"><div class="k">生命</div><div class="v" id="lives">3</div></div>
  </div>
  <canvas id="cv" width="400" height="560"></canvas>
  <button class="face" id="face" title="重开">🙂</button>
  <div class="status" id="status">点击/触摸屏幕发射小球</div>
  <div class="tips">电脑：移动鼠标控制挡板。手机：手指左右拖动挡板。<br>接住小球打掉全部砖块进入下一关，球掉落扣一条命。</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'), levelEl=document.getElementById('level'),
      livesEl=document.getElementById('lives'), statusEl=document.getElementById('status'), faceEl=document.getElementById('face');
const W=cv.width, H=cv.height;
const PCOLORS=['#ff8a8a','#ffb454','#4ec9b0','#6ee7ff','#c08bff'];

let paddle, ball, bricks, score, level, lives, running, launched, raf;
function reset(){ score=0; level=1; lives=3; buildLevel(); updateHud(); }
function buildLevel(){ const rows=4+Math.min(level,4), cols=9, bw=W/cols-6, bh=18, top=60;
  bricks=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    bricks.push({x:6+c*(bw+6), y:top+r*(bh+6), w:bw, h:bh, c:PCOLORS[r%PCOLORS.length], on:true});
  const sp=4+level*0.6;
  ball={x:W/2, y:H-40, r:7, dx:sp*(Math.random()<.5?-1:1), dy:-sp, sp};
  paddle={w:84, h:12, x:W/2-42, y:H-26};
  launched=false; running=true; statusEl.textContent='点击/触摸发射小球';
}
function updateHud(){ scoreEl.textContent=score; levelEl.textContent=level; livesEl.textContent=lives; }
function launch(){ if(!launched){ launched=true; statusEl.textContent=''; } }
function loop(){ if(!running) return;
  if(launched){ ball.x+=ball.dx; ball.y+=ball.dy;
    if(ball.x-ball.r<0){ ball.x=ball.r; ball.dx*=-1; }
    if(ball.x+ball.r>W){ ball.x=W-ball.r; ball.dx*=-1; }
    if(ball.y-ball.r<0){ ball.y=ball.r; ball.dy*=-1; }
    if(ball.y+ball.r>paddle.y && ball.x>paddle.x && ball.x<paddle.x+paddle.w && ball.dy>0){
      ball.y=paddle.y-ball.r; const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      ball.dx=ball.sp*hit; ball.dy=-Math.abs(ball.dy); }
    if(ball.y-ball.r>H){ lives--; updateHud();
      if(lives<=0){ running=false; statusEl.style.color='#ff8a8a'; statusEl.textContent='💥 游戏结束，点笑脸重开'; faceEl.textContent='😵'; return; }
      ball.x=W/2; ball.y=H-40; ball.dx=ball.sp*(Math.random()<.5?-1:1); ball.dy=-ball.sp; launched=false; statusEl.textContent='点击/触摸发射小球'; }
  }
  for(const b of bricks){ if(b.on && ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
    b.on=false; score+=10*level; updateHud();
    const overlapX=Math.min(ball.x+ball.r,b.x+b.w)-Math.max(ball.x-ball.r,b.x);
    const overlapY=Math.min(ball.y+ball.r,b.y+b.h)-Math.max(ball.y-ball.r,b.y);
    if(overlapX<overlapY) ball.dx*=-1; else ball.dy*=-1; break; } }
  if(bricks.every(b=>!b.on)){ level++; updateHud(); buildLevel(); return; }
  draw(); raf=requestAnimationFrame(loop);
}
function draw(){ ctx.fillStyle='#141821'; ctx.fillRect(0,0,W,H);
  for(const b of bricks) if(b.on){ ctx.fillStyle=b.c; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(b.x,b.y,b.w,3); }
  ctx.fillStyle='#e8ecf5'; ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fillStyle='#ffb454'; ctx.fill();
}
function pointer(e){ const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; paddle.x=cx-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x)); if(launched) draw(); }
cv.addEventListener('mousemove',pointer);
cv.addEventListener('touchmove',e=>{ e.preventDefault(); pointer(e); },{passive:false});
cv.addEventListener('mousedown',launch); cv.addEventListener('touchstart',e=>{ e.preventDefault(); launch(); pointer(e); },{passive:false});

function start(){ cancelAnimationFrame(raf); faceEl.textContent='🙂'; statusEl.style.color='var(--good)'; reset(); draw(); raf=requestAnimationFrame(loop); }
faceEl.addEventListener('click', start);
start();
</script>
</body></html>
